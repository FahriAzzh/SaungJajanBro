<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Toko - SaungJajan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
        }
        /* Menghilangkan scrollbar default bawaan browser jika diperlukan */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#1f1f1f] min-h-screen flex items-center justify-center p-0 md:p-6 lg:p-8">

    <div class="w-full max-w-[450px] lg:max-w-[1000px] bg-white min-h-screen lg:min-h-[780px] lg:rounded-[40px] shadow-2xl overflow-hidden p-6 md:p-8 flex flex-col justify-between border-0 md:border-[8px] border-slate-800 transition-all duration-300">
        
        <div>
            <div class="flex items-center justify-between mb-6 border-b-2 border-slate-100 pb-4">
                <h1 class="text-4xl lg:text-5xl font-bold tracking-tight text-black">Saung Jajan</h1>
                <a href="../Auth/login-toko.html" class="bg-[#7371fc] text-black text-lg lg:text-xl font-bold px-6 py-2 rounded-2xl hover:bg-[#5b59e0] transition-colors border-2 border-black/10 shadow-sm">
                    Logout
                </a>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-8 text-center border-b-2 border-slate-100">
                <a href="#" class="text-[#7371fc] text-2xl lg:text-3xl font-bold pb-3 border-b-4 border-[#7371fc]">Home</a>
                <a href="produk.html" class="text-slate-400 hover:text-black text-2xl lg:text-3xl font-bold pb-3 transition-colors">Produk</a>
                <a href="laporan-penjualan.html" class="text-slate-400 hover:text-black text-2xl lg:text-3xl font-bold pb-3 transition-colors">Laporan</a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <div class="lg:col-span-7 space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-[#7371fc] rounded-[28px] p-5 flex flex-col items-center justify-center shadow-md min-h-[140px] lg:min-h-[150px] border border-black/5">
                            <span class="text-5xl lg:text-6xl font-bold text-white mb-2 drop-shadow-sm">0</span>
                            <span class="text-md lg:text-lg font-bold text-black/80 tracking-wide text-center">Total Produk</span>
                        </div>

                        <div class="bg-[#7371fc] rounded-[28px] p-5 flex flex-col items-center justify-center shadow-md min-h-[140px] lg:min-h-[150px] border border-black/5">
                            <span class="text-5xl lg:text-6xl font-bold text-white mb-2 drop-shadow-sm">0</span>
                            <span class="text-md lg:text-lg font-bold text-black/80 tracking-wide text-center">Total Stok</span>
                        </div>

                        <div class="bg-[#7371fc] rounded-[28px] p-5 flex flex-col items-center justify-center shadow-md min-h-[140px] lg:min-h-[150px] border border-black/5">
                            <span class="text-5xl lg:text-6xl font-bold text-white mb-2 drop-shadow-sm">0</span>
                            <span class="text-md lg:text-lg font-bold text-black/80 tracking-wide text-center">Pesanan Masuk</span>
                        </div>

                        <div class="bg-[#7371fc] rounded-[28px] p-5 flex flex-col items-center justify-center shadow-md min-h-[140px] lg:min-h-[150px] border border-black/5">
                            <span class="text-5xl lg:text-6xl font-bold text-white mb-2 drop-shadow-sm">0</span>
                            <span class="text-md lg:text-lg font-bold text-black/80 tracking-wide text-center">Pendapatan</span>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-5 space-y-6">
                    <button type="button" onclick="if(window.innerWidth < 1024) document.getElementById('formInputProduk').classList.toggle('hidden')"
                            class="w-full bg-[#7371fc] text-black text-xl lg:text-2xl font-bold py-3.5 px-4 rounded-2xl shadow-md hover:bg-[#5b59e0] hover:text-white transition-all text-center block border border-black/10">
                        Tambah Produk
                    </button>

                    <div id="formInputProduk" class="bg-[#dcdcdc] rounded-[32px] overflow-hidden shadow-inner border border-slate-300 lg:block">
                        <div class="bg-[#7371fc] text-center py-3 border-b border-black/5">
                            <h2 class="text-3xl lg:text-4xl font-bold text-black tracking-wide">Rogut</h2>
                        </div>
                        
                        <form method="post" action="#" class="p-6 space-y-5">
                            <div class="flex items-center justify-between gap-4">
                                <label class="text-xl lg:text-2xl font-bold text-black min-w-[85px]">Jenis:</label>
                                <input type="text" name="jenis" class="w-full bg-white rounded-xl py-2 px-4 text-lg border-none focus:outline-none focus:ring-4 focus:ring-[#7371fc]/50 shadow-sm transition-all" />
                            </div>

                            <div class="flex items-center justify-between gap-4">
                                <label class="text-xl lg:text-2xl font-bold text-black min-w-[85px]">Harga:</label>
                                <input type="number" name="harga" class="w-full bg-white rounded-xl py-2 px-4 text-lg border-none focus:outline-none focus:ring-4 focus:ring-[#7371fc]/50 shadow-sm transition-all" />
                            </div>

                            <div class="flex items-center justify-between gap-4">
                                <label class="text-xl lg:text-2xl font-bold text-black min-w-[85px]">Stok:</label>
                                <input type="number" name="stok" class="w-full bg-white rounded-xl py-2 px-4 text-lg border-none focus:outline-none focus:ring-4 focus:ring-[#7371fc]/50 shadow-sm transition-all" />
                            </div>

                            <div class="pt-2">
                                <button type="submit" class="w-full bg-[#7371fc] text-black text-xl lg:text-2xl font-bold py-2.5 px-4 rounded-2xl hover:bg-[#5b59e0] hover:text-white transition-all shadow-md border border-black/10">
                                    Simpan
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>

        <div class="mt-12 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
            &copy; 2026 - SaungJajan
        </div>

    </div>

</body>
</html>
