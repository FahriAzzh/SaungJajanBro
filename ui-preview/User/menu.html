<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Warung - SaungJajan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding-bottom: 60px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PREMIUM NAVBAR STYLING --- */
        .custom-navbar {
            padding: 16px 0;
            background-color: #ffffff;
            border-bottom: 1px solid #efeefc;
            box-shadow: 0 2px 12px rgba(118, 117, 238, 0.03);
        }

        .nav-logo {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #000000;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-logo:hover { color: #000000; opacity: 0.85; }

        .nav-links-center {
            display: flex;
            align-items: center;
            gap: 35px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-link-item {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000000;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 2.5px;
        }

        .nav-link-item:hover { color: #7675ee; }

        .cart-icon-btn {
            background: none;
            border: none;
            color: #000000;
            display: inline-flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .cart-icon-btn:hover { transform: scale(1.08); color: #7675ee; }

        .user-balance-box {
            background-color: #f1f1f5;
            border-radius: 14px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e2e2ea;
            max-width: 260px;
        }

        .wallet-icon-wrapper {
            background-color: #ffffff;
            color: #7675ee;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        .balance-info-text { display: flex; flex-direction: column; text-align: left; line-height: 1.3; }
        .balance-info-text .user-name { font-size: 0.95rem; font-weight: 700; color: #111111; }
        .balance-info-text .balance-label { font-size: 0.8rem; font-weight: 600; color: #666666; text-transform: uppercase; }
        .balance-info-text .balance-amount { font-size: 1.1rem; font-weight: 700; color: #000000; }

        /* --- CONTENT BODY --- */
        .page-title { font-size: 3.2rem; font-weight: 700; margin-top: 40px; margin-bottom: 4px; }
        .page-subtitle { font-size: 1.5rem; font-weight: 700; margin-bottom: 30px; }

        .select-warung-custom {
            background-color: #e2e7ff !important;
            border: 1px solid #c2cfff !important;
            border-radius: 50px !important;
            padding: 14px 30px !important;
            font-size: 1.6rem !important;
            text-align: center;
            color: #000000 !important;
            max-width: 480px;
            margin: 0 auto 55px auto;
        }

        .section-heading {
            font-size: 2rem;
            font-weight: 700;
            text-align: left;
            margin-bottom: 30px;
            padding-left: 8px;
            border-left: 5px solid #7675ee;
        }

        /* --- CARD PRODUCT PREMIUM --- */
        .product-card-custom {
            border: none !important;
            background: none !important;
            border-radius: 22px !important;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .product-card-custom:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(118, 117, 238, 0.12);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #7675ee;
            overflow: hidden;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card-custom:hover .product-img {
            transform: scale(1.06);
        }

        .product-image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 60%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .product-card-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: left;
        }

        .product-card-body {
            background-color: #dbdbdb;
            padding: 22px 25px;
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
        }

        .product-price {
            font-size: 1.9rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 18px;
            text-align: left;
            letter-spacing: -0.5px;
        }

        .qty-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .qty-label { font-size: 1.3rem; font-weight: 700; color: #000000; }

        /* ==========================================================================
           FITUR BARU: TOUCHSCREEN-FRIENDLY QUANTITY STEPPER DI LAYOUT ABU-ABU
           ========================================================================== */
        .touch-stepper {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        /* Tombol + dan - Besar Ramah Jari */
        .stepper-btn {
            background: none;
            border: none;
            width: 40px;
            height: 42px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #7675ee;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease;
        }

        .stepper-btn:hidden { display: none; }
        .stepper-btn:active { background-color: #f1f1f5; }
        .stepper-btn:focus { outline: none; }

        /* Input Tengah Tetap Sinkron & Menghilangkan Arrow Bawaan Browser */
        .qty-input-custom {
            width: 45px !important;
            height: 42px !important;
            border: none !important;
            background-color: transparent !important;
            text-align: center;
            font-size: 1.3rem !important;
            font-weight: 700;
            padding: 0 !important;
            color: #000000;
            -moz-appearance: textfield;
        }

        .qty-input-custom::-webkit-outer-spin-button,
        .qty-input-custom::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-add-cart {
            background-color: #7675ee !important;
            color: #000000 !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 12px 24px !important;
            font-size: 1.3rem !important;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-add-cart:hover { background-color: #6362dc !important; color: #ffffff !important; }

        @media (max-width: 768px) {
            .custom-navbar .container { flex-direction: column; gap: 16px; text-align: center; }
            .nav-links-center { justify-content: center; gap: 25px; }
            .user-balance-box { margin: 0 auto; width: 100%; max-width: 280px; }
            .page-title { font-size: 2.4rem; }
        }
    </style>
</head>
<body>

    <nav class="custom-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="nav-logo" href="#">Saung Jajan</a>

            <ul class="nav-links-center">
                <li><a href="#" class="nav-link-item">Home</a></li>
                <li><a href="log-pesanan.html" class="nav-link-item">Log</a></li>
                <li>
                    <a href="keranjang.html" class="cart-icon-btn" title="Lihat Keranjang Belanja">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a1 1 0 1 0 0 2 1 1 0 0 0 0 -2m7 0a1 1 0 1 0 0 2 1 1 0 0 0 0 -2"/>
                        </svg>
                    </a>
                </li>
            </ul>

            <div class="user-balance-box">
                <div class="wallet-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-wallet2" viewBox="0 0 16 16">
                        <path d="M12.136.326A1.5 1.5 0 0 1 14 1.78V3h.5A1.5 1.5 0 0 1 16 4.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 13.5v-9A1.5 1.5 0 0 1 1.5 3H2V1.78a1.5 1.5 0 0 1 1.864-1.454zM3 3h9v-.191A.5.5 0 0 0 11.378 2.34L3 3zm11 1.5h-11v9h11z"/>
                    </svg>
                </div>
                <div class="balance-info-text">
                    <span class="user-name">Budi Santoso</span>
                    <span class="balance-label">Saldo Anda</span>
                    <span class="balance-amount">Rp 150.000</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container text-center">
        <main role="main" class="pt-2">

            <h2 class="page-title">Menu Warung</h2>
            <p class="page-subtitle">Pilih Warung</p>

            <div class="mb-4">
                <form method="get">
                    <select name="SelectedTokoId" class="form-select select-warung-custom" onchange="this.form.submit()">
                        <option value="">-- Pilih warung --</option>
                        <option value="1" selected>Warung Bu Sari</option>
                        <option value="2">Kedai Pak Budi</option>
                        <option value="3">Toko Makan Cepat</option>
                    </select>
                </form>
            </div>

            <h3 class="section-heading">Produk</h3>

            <div class="row g-4">
                
                <div class="col-md-6 col-lg-4">
                    <div class="card product-card-custom">
                        <div class="product-image-container">
                            <img src="https://images.unsplash.com/photo-1626804475315-9644b37a2fe4?w=500&q=80" alt="Mie Ayam Spesial" class="product-img" onerror="this.src='https://placehold.co/500x312/7675ee/000000?text=Saung+Jajan'">
                            <div class="product-image-overlay">
                                <h5 class="product-card-title">Mie Ayam Spesial</h5>
                            </div>
                        </div>
                        
                        <div class="product-card-body">
                            <div class="product-price">Rp.15.000</div>
                            <form method="post" action="#" class="add-cart-form">
                                <div class="qty-wrapper">
                                    <label class="qty-label">Jumlah</label>
                                    
                                    <div class="touch-stepper">
                                        <button type="button" class="stepper-btn btn-minus">−</button>
                                        <input type="number" name="quantity" value="1" min="1" max="20" class="form-control qty-input-custom" required readonly />
                                        <button type="button" class="stepper-btn btn-plus">+</button>
                                    </div>
                                </div>
                                <input type="hidden" name="selectedTokoId" value="1" />
                                <input type="hidden" name="productId" value="1" />
                                <button type="submit" class="btn btn-add-cart">+ Keranjang</button>
                                <div class="small mt-2 text-success d-none add-cart-message"></div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="card product-card-custom">
                        <div class="product-image-container">
                            <img src="https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=500&q=80" alt="Nasi Goreng Biasa" class="product-img" onerror="this.src='https://placehold.co/500x312/7675ee/000000?text=Saung+Jajan'">
                            <div class="product-image-overlay">
                                <h5 class="product-card-title">Nasi Goreng Biasa</h5>
                            </div>
                        </div>
                        
                        <div class="product-card-body">
                            <div class="product-price">Rp.12.000</div>
                            <form method="post" action="#" class="add-cart-form">
                                <div class="qty-wrapper">
                                    <label class="qty-label">Jumlah</label>
                                    
                                    <div class="touch-stepper">
                                        <button type="button" class="stepper-btn btn-minus">−</button>
                                        <input type="number" name="quantity" value="1" min="1" max="15" class="form-control qty-input-custom" required readonly />
                                        <button type="button" class="stepper-btn btn-plus">+</button>
                                    </div>
                                </div>
                                <input type="hidden" name="selectedTokoId" value="1" />
                                <input type="hidden" name="productId" value="2" />
                                <button type="submit" class="btn btn-add-cart">+ Keranjang</button>
                                <div class="small mt-2 text-success d-none add-cart-message"></div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="card product-card-custom">
                        <div class="product-image-container">
                            <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=500&q=80" alt="Es Teh Manis" class="product-img" onerror="this.src='https://placehold.co/500x312/7675ee/000000?text=Saung+Jajan'">
                            <div class="product-image-overlay">
                                <h5 class="product-card-title">Es Teh Manis</h5>
                            </div>
                        </div>
                        
                        <div class="product-card-body">
                            <div class="product-price">Rp.5.000</div>
                            <form method="post" action="#" class="add-cart-form">
                                <div class="qty-wrapper">
                                    <label class="qty-label">Jumlah</label>
                                    
                                    <div class="touch-stepper">
                                        <button type="button" class="stepper-btn btn-minus">−</button>
                                        <input type="number" name="quantity" value="1" min="1" max="50" class="form-control qty-input-custom" required readonly />
                                        <button type="button" class="stepper-btn btn-plus">+</button>
                                    </div>
                                </div>
                                <input type="hidden" name="selectedTokoId" value="1" />
                                <input type="hidden" name="productId" value="3" />
                                <button type="submit" class="btn btn-add-cart">+ Keranjang</button>
                                <div class="small mt-2 text-success d-none add-cart-message"></div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // LOGIKA TOUCH STEPPER BUTTONS (MINUS / PLUS HANDLER)
            const steppers = document.querySelectorAll('.touch-stepper');
            steppers.forEach(function (stepper) {
                const minusBtn = stepper.querySelector('.btn-minus');
                const plusBtn = stepper.querySelector('.btn-plus');
                const input = stepper.querySelector('.qty-input-custom');

                // Ambil batas minimum & maksimum dari atribut HTML input bawaan
                const minVal = parseInt(input.getAttribute('min')) || 1;
                const maxVal = parseInt(input.getAttribute('max')) || 99;

                minusBtn.addEventListener('click', function () {
                    let currentVal = parseInt(input.value) || minVal;
                    if (currentVal > minVal) {
                        input.value = currentVal - 1;
                    }
                });

                plusBtn.addEventListener('click', function () {
                    let currentVal = parseInt(input.value) || minVal;
                    if (currentVal < maxVal) {
                        input.value = currentVal + 1;
                    }
                });
            });

            // AJAX HANDLER UNTUK FORM KERANJANG
            const forms = document.querySelectorAll('.add-cart-form');
            forms.forEach(function (form) {
                form.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    const button = form.querySelector('button[type="submit"]');
                    const message = form.querySelector('.add-cart-message');
                    button.disabled = true;
                    const oldText = button.innerText;
                    button.innerText = 'Menambahkan...';

                    try {
                        const response = await fetch(form.action, {
                            method: 'POST',
                            body: new FormData(form),
                            headers: { 'X-Requested-With': 'XMLHttpRequest' }
                        });
                        const result = await response.json();
                        message.classList.remove('d-none', 'text-danger', 'text-success');
                        message.classList.add(result.success ? 'text-success' : 'text-danger');
                        message.innerText = result.message;

                        if (result.success) {
                            button.innerText = 'Berhasil Ditambahkan';
                            setTimeout(function () { button.innerText = oldText; button.disabled = false; }, 900);
                        } else {
                            button.innerText = oldText; button.disabled = false;
                        }
                    } catch {
                        message.classList.remove('d-none', 'text-success');
                        message.classList.add('text-danger');
                        message.innerText = 'Gagal menambahkan produk ke keranjang.';
                        button.innerText = oldText; button.disabled = false;
                    }
                });
            });
        });
    </script>
</body>
</html>
