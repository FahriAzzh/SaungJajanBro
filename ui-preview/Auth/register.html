<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun - SaungJajan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 640px; /* Lebar maksimal disesuaikan untuk layout 2 kolom PC */
            text-align: center;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #000000;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 1.4rem;
            color: #000000;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .form-label-custom {
            display: block;
            text-align: left;
            font-weight: 700;
            font-size: 1.15rem;
            color: #000000;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        .form-control-custom {
            background-color: #dbe5ff !important; /* Warna biru muda lembut sesuai mockup */
            border: none !important;
            border-radius: 4px !important;
            padding: 12px 16px !important;
            font-size: 1.1rem !important;
            color: #2b2b2b !important;
            transition: all 0.2s ease-in-out;
        }

        .form-control-custom:focus {
            background-color: #ccd9ff !important;
            box-shadow: 0 0 0 0.25rem rgba(118, 117, 238, 0.25) !important;
            outline: none;
        }

        .btn-custom {
            background-color: #7675ee !important;
            border: none !important;
            border-radius: 50px !important; /* Bentuk elips memanjang */
            padding: 14px 25px !important;
            font-size: 1.4rem !important;
            font-weight: 700;
            color: #ffffff !important; /* Teks putih sesuai gambar */
            transition: all 0.2s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #6362dc !important;
            opacity: 0.95;
        }

        .btn-custom:active {
            transform: scale(0.98);
        }

        .login-link-container {
            margin-top: 20px;
        }

        .login-link {
            font-family: 'Nunito', sans-serif;
            font-style: italic;
            font-weight: 700;
            font-size: 1.2rem;
            color: #5856d6;
            text-decoration: underline;
        }

        .login-link:hover {
            color: #4341b7;
        }

        /* Responsive Optimization (PC vs Mobile) */
        @media (max-width: 768px) {
            .register-container {
                max-width: 440px; /* Menyusut ke ukuran single column di device kecil */
            }
            .brand-title {
                font-size: 2.8rem;
            }
            .brand-subtitle {
                font-size: 1.25rem;
                margin-bottom: 30px;
            }
            .form-control-custom {
                padding: 10px 14px !important;
                font-size: 1rem !important;
            }
            .btn-custom {
                font-size: 1.25rem !important;
                padding: 12px 20px !important;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h1 class="brand-title">Saung Jajan</h1>
        <p class="brand-subtitle">Buat akun baru</p>

        <form method="post" action="#">
            
            <div class="row text-start">
                <div class="col-md-6 mb-3">
                    <label class="form-label-custom">Nama Lengkap</label>
                    <input type="text" name="Input.Nama" class="form-control form-control-custom" required />
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label-custom">Password</label>
                    <input type="password" name="Input.Password" class="form-control form-control-custom" required />
                </div>
            </div>

            <div class="row text-start">
                <div class="col-md-6 mb-3">
                    <label class="form-label-custom">Email</label>
                    <input type="email" name="Input.Email" class="form-control form-control-custom" required />
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label-custom">Konfirmasi Password</label>
                    <input type="password" name="Input.KonfirmasiPassword" class="form-control form-control-custom" required />
                </div>
            </div>

            <div class="row text-start mb-5">
                <div class="col-12">
                    <label class="form-label-custom">Saldo Awal (Rp)</label>
                    <input type="number" name="Input.Saldo" class="form-control form-control-custom" value="0" min="0" step="1000" />
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8 d-grid">
                    <button type="submit" class="btn btn-custom">
                        Register
                    </button>
                </div>
            </div>
        </form>

        <div class="login-link-container">
            <a href="login.html" class="login-link">Sudah punya akun? Login</a>
        </div>
    </div>

</body>
</html>
