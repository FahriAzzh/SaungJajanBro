<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SaungJajan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 10px;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #000000;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 1.5rem;
            color: #000000;
            font-weight: 400;
            margin-bottom: 50px;
        }

        .form-control-custom {
            background-color: #dbdbdb !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 14px 25px !important;
            font-size: 1.15rem !important;
            text-align: center;
            color: #2b2b2b !important;
            font-style: italic;
            transition: all 0.2s ease-in-out;
        }

        .form-control-custom::placeholder {
            color: #555555;
            font-style: italic;
            opacity: 0.8;
        }

        .form-control-custom:focus {
            background-color: #cfcfcf !important;
            box-shadow: 0 0 0 0.25rem rgba(118, 117, 238, 0.25) !important;
            outline: none;
        }

        .btn-custom {
            background-color: #7675ee !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 14px 25px !important;
            font-size: 1.3rem !important;
            font-weight: 700;
            color: #000000 !important;
            transition: all 0.2s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #6362dc !important;
            opacity: 0.95;
        }

        .btn-custom:active {
            transform: scale(0.98);
        }

        /* Responsive Optimization */
        @media (max-width: 576px) {
            .brand-title {
                font-size: 2.8rem;
            }
            .brand-subtitle {
                font-size: 1.3rem;
                margin-bottom: 40px;
            }
            .form-control-custom, .btn-custom {
                padding: 12px 20px !important;
                font-size: 1.1rem !important;
            }
            .btn-custom {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="brand-title">Saung Jajan</h1>
        <p class="brand-subtitle">Masuk ke akun kamu</p>

        <form method="post" action="#">
            <div class="mb-4">
                <input id="Input_Email" name="Input.Email" type="email" class="form-control form-control-custom" placeholder="user@gmail.com" required />
            </div>

            <div class="mb-5">
                <input id="Input_Password" name="Input.Password" type="password" class="form-control form-control-custom" placeholder="masukkan password" required />
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom">
                    Login
                </button>
            </div>
        </form>
    </div>

</body>
</html>
