<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Toko - SaungJajan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            padding: 10px;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #000000;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 1.4rem;
            color: #000000;
            font-weight: 700;
            margin-bottom: 50px;
            line-height: 1.3;
        }

        /* Custom style agar elemen select menyerupai kapsul abu-abu pada mockup */
        .form-select-custom {
            background-color: #dbdbdb !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 14px 25px !important;
            font-size: 1.2rem !important;
            text-align: center;
            color: #495057 !important;
            font-style: italic;
            appearance: none; /* Menghapus panah default browser agar teks rata tengah sempurna */
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        /* Mengembalikan style normal untuk opsi list dropdown saat di-klik */
        .form-select-custom option {
            font-style: normal;
            text-align: left;
        }

        .form-select-custom:focus {
            background-color: #cfcfcf !important;
            box-shadow: 0 0 0 0.25rem rgba(118, 117, 238, 0.25) !important;
            outline: none;
        }

        .btn-custom {
            background-color: #7675ee !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 14px 25px !important;
            font-size: 1.3rem !important;
            font-weight: 700;
            color: #000000 !important;
            transition: all 0.2s ease-in-out;
        }

        .btn-custom:hover {
            background-color: #6362dc !important;
            opacity: 0.95;
        }

        .btn-custom:active {
            transform: scale(0.98);
        }

        /* Optimasi Responsif Layar */
        @media (max-width: 576px) {
            .brand-title {
                font-size: 2.8rem;
            }
            .brand-subtitle {
                font-size: 1.15rem;
                margin-bottom: 40px;
            }
            .form-select-custom, .btn-custom {
                padding: 12px 20px !important;
                font-size: 1.1rem !important;
            }
            .btn-custom {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="brand-title">Login Toko</h1>
        <p class="brand-subtitle">Pilih toko untuk masuk ke dashboard toko.</p>

        <form method="post" action="#">
            <div class="mb-5">
                <select name="IdToko" class="form-select form-select-custom" required>
                    <option value="" selected>[pilih toko]</option>
                    <option value="1">Warung Bu Sari</option>
                    <option value="2">Kedai Pak Budi</option>
                    <option value="3">Toko Makan Cepat</option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom">
                    Masuk Dashboard Toko
                </button>
            </div>
        </form>
    </div>

</body>
</html>
